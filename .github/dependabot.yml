---
version: 2
updates:
  # Go modules - separate block for each directory
  - package-ecosystem: "gomod"
    directory: "/attestation-verifier/src"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
      semver-patch-days: 2
    commit-message:
      prefix: "deps"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    reviewers:
      - "srinivasmusti"
      - "pchand20"
      - "vtcao297"
      - "shahmitu"
      - "hemanthsm"
  
  - package-ecosystem: "gomod"
    directory: "/attestation-manager/src"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
      semver-patch-days: 2
    commit-message:
      prefix: "deps"
    open-pull-requests-limit: 5
