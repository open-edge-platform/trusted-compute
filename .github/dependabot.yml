      - "dependencies"
    reviewers:
      - "srinivasmusti"
      - "pchand20"
      - "vtcao297"
      - "shahmitu"
      - "hemanthsm"

  # Docker - separate block for each directory
  - package-ecosystem: "docker"
    directory: "/attestation-manager"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
      semver-patch-days: 3
