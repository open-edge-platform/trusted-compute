---
name: Virtual Integration

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "*"
    types:
      - opened
      - synchronize
      - reopened
  merge_group:

concurrency:
  group: ${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  pre-checks:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      changed_projects: ${{ steps.discover-changes.outputs.changed_projects }}
      workflow_changed: ${{ steps.detect-workflow-change.outputs.workflow_changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: "Discover Changed Subfolders"
        id: discover-changes
        uses: open-edge-platform/orch-ci/discover-changed-subfolders@397dffe012cee10625714cd3f14f8200bde000db  # 2026.1.4
      - name: Detect virtual integration workflow change
        id: detect-workflow-change
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MERGE_GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          case "$EVENT_NAME" in
            pull_request)
              base_sha="$PR_BASE_SHA"
              head_sha="$PR_HEAD_SHA"
              ;;
            push)
              base_sha="$PUSH_BASE_SHA"
              head_sha="$HEAD_SHA"
              ;;
            merge_group)
              base_sha="$MERGE_GROUP_BASE_SHA"
              head_sha="$MERGE_GROUP_HEAD_SHA"
              ;;
            *)
              echo "workflow_changed=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac

          git cat-file -e "${base_sha}^{commit}"
          git cat-file -e "${head_sha}^{commit}"

          workflow_changed=false
          if git diff --name-only "$base_sha" "$head_sha" -- \
            .github/workflows/virtual-integration.yml | grep -Fxq '.github/workflows/virtual-integration.yml'; then
            workflow_changed=true
          fi

          echo "workflow_changed=$workflow_changed" >> "$GITHUB_OUTPUT"

  wait-for-pre-merge:
    if: ${{ github.event_name == 'pull_request' }}
    permissions:
      actions: read
      contents: read
    needs: [pre-checks]
    runs-on: ubuntu-latest
    outputs:
      pre_merge_run_id: ${{ steps.wait-for-pre-merge-run.outputs.pre_merge_run_id }}
    steps:
      - name: Wait for pre-merge-pipeline job to complete
        id: wait-for-pre-merge-run
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3   # v9.0.0
        env:
          TARGET_WORKFLOW_FILE: pre-merge.yml
          TARGET_EVENT: pull_request
          TARGET_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TARGET_JOB_PREFIX: pre-merge-pipeline
          TIMEOUT_SECONDS: "5400"
          POLL_INTERVAL_SECONDS: "30"
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const workflowId = process.env.TARGET_WORKFLOW_FILE;
            const targetEvent = process.env.TARGET_EVENT;
            const targetHeadSha = process.env.TARGET_HEAD_SHA;
            const targetJobPrefix = process.env.TARGET_JOB_PREFIX;
            const timeoutMs = Number(process.env.TIMEOUT_SECONDS) * 1000;
            const intervalMs = Number(process.env.POLL_INTERVAL_SECONDS) * 1000;
            const started = Date.now();

            while (true) {
              const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
                owner,
                repo,
                workflow_id: workflowId,
                event: targetEvent,
                per_page: 100
              });

              const run = runs.find(r => r.head_sha === targetHeadSha);

              if (run) {
                const { data } = await github.rest.actions.listJobsForWorkflowRun({
                  owner,
                  repo,
                  run_id: run.id,
                  per_page: 100
                });

                const jobs = data.jobs ?? [];

                const targetJobs = jobs.filter(j =>
                  j.name === targetJobPrefix || j.name.startsWith(`${targetJobPrefix} (`)
                );

                if (targetJobs.length > 0) {
                  const unfinished = targetJobs.filter(j => j.status !== "completed");
                  if (unfinished.length === 0) {
                    const bad = targetJobs.find(j => j.conclusion !== "success" && j.conclusion !== "skipped");
                    if (bad) {
                      core.setFailed(`Job ${bad.name} concluded with status: ${bad.conclusion}`);
                      return;
                    }

                    core.setOutput('pre_merge_run_id', String(run.id));
                    core.info(`All ${targetJobPrefix} jobs completed successfully/skipped for ${targetHeadSha}`);
                    return;
                  }

                  core.info(
                    `Waiting for ${targetJobPrefix} jobs: ${unfinished.map(j => `${j.name}(${j.status})`).join(', ')}`
                  );
                } else if (run.status === "completed") {
                  core.setFailed(`No ${targetJobPrefix} job found in pre-merge run for ${targetHeadSha}`);
                  return;
                }
              }

              if (Date.now() - started > timeoutMs) {
                core.setFailed(`Timed out waiting for ${targetJobPrefix} on ${targetHeadSha}`);
                return;
              }

              core.info(`Waiting for ${targetJobPrefix} in Pre-Merge CI Pipeline on ${targetHeadSha}...`);
              await new Promise(resolve => setTimeout(resolve, intervalMs));
            }

  prepare-installation-package:
    if: ${{ always() && (needs.pre-checks.outputs.workflow_changed == 'true' || contains(needs.pre-checks.outputs.changed_projects, 'attestation-manager') || contains(needs.pre-checks.outputs.changed_projects, 'attestation-verifier') || contains(needs.pre-checks.outputs.changed_projects, 'baremetal') || contains(needs.pre-checks.outputs.changed_projects, 'helm') || contains(needs.pre-checks.outputs.changed_projects, 'tests') || contains(needs.pre-checks.outputs.changed_projects, 'trusted-vm') || contains(needs.pre-checks.outputs.changed_projects, 'trusted-workload')) && (github.event_name != 'pull_request' || needs.wait-for-pre-merge.result == 'success') }}
    permissions:
      actions: read
      contents: read
    needs: [pre-checks, wait-for-pre-merge]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      - name: Build Trusted Compute package
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_NUMBER: ${{ github.event.number }}
          CHANGED_PROJECTS: ${{ needs.pre-checks.outputs.changed_projects }}
        run: |
          echo "Installing build prerequisites..."
          sudo apt-get update -qq
          sudo apt-get install -y curl make tar jq

          base_suffix=""
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_suffix="-pr-$EVENT_NUMBER"
          fi

          changed_projects="$CHANGED_PROJECTS"
          declare -A project_suffix

          if [[ "$changed_projects" != "[]" ]]; then
            for project in $(echo "$changed_projects" | jq -r '.[]'); do
              project_suffix["$project"]="$base_suffix"
            done
          fi

          av_suffix="${project_suffix[attestation-verifier]}"
          am_suffix="${project_suffix[attestation-manager]}"
          tw_suffix="${project_suffix[trusted-workload]}"
          kd_suffix="${project_suffix[trusted-workload]}"

          YQ_VERSION="v4.44.6"
          HELM_VERSION="v3.16.4"

          arch="$(uname -m)"
          case "$arch" in
            x86_64)
              yq_arch="amd64"
              helm_arch="amd64"
              yq_sha256="0c2b24e645b57d8e7c0566d18643a6d4f5580feeea3878127354a46f2a1e4598"
              helm_sha256="fc307327959aa38ed8f9f7e66d45492bb022a66c3e5da6063958254b9767d179"
              ;;
            aarch64|arm64)
              yq_arch="arm64"
              helm_arch="arm64"
              yq_sha256="9477ac3cc447b6c083986129e35af8122eb2b938fe55c9c3e40436fb966e5813"
              helm_sha256="d3f8f15b3d9ec8c8678fbf3280c3e5902efabe5912e2f9fcf29107efbc8ead69"
              ;;
            *)
              echo "Unsupported architecture: $arch"
              exit 1
              ;;
          esac

          yq_url="https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_${yq_arch}"
          yq_tmp="/tmp/yq"
          curl -fsSL "$yq_url" -o "$yq_tmp"
          echo "${yq_sha256}  ${yq_tmp}" | sha256sum -c -
          chmod +x "$yq_tmp"
          sudo mv "$yq_tmp" /usr/local/bin/yq

          if ! command -v helm >/dev/null 2>&1; then
            helm_tgz="/tmp/helm-${HELM_VERSION}-linux-${helm_arch}.tar.gz"
            curl -fsSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-${helm_arch}.tar.gz" -o "$helm_tgz"
            echo "${helm_sha256}  ${helm_tgz}" | sha256sum -c -
            tar -C /tmp -xzf "$helm_tgz"
            sudo mv "/tmp/linux-${helm_arch}/helm" /usr/local/bin/helm
            rm -rf "$helm_tgz" "/tmp/linux-${helm_arch}"
          fi

          echo "Building Trusted Compute installation package..."
          make -C baremetal build \
            ATTESTATION_VERIFIER_VERSION="$(cat attestation-verifier/VERSION)${av_suffix}" \
            ATTESTATION_MANAGER_VERSION="$(cat attestation-manager/VERSION)${am_suffix}" \
            TRUSTED_WORKLOAD_VERSION="$(cat trusted-workload/VERSION)${tw_suffix}" \
            KATA_DEPLOY_VERSION="$(cat trusted-workload/kata-deploy/VERSION)${kd_suffix}"

          echo "Build complete:"
          ls -lh baremetal/trusted-compute-installation-package.tgz

      - name: Download docker-images-attestation-verifier artifact
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]' && contains(needs.pre-checks.outputs.changed_projects, 'attestation-verifier') && needs.wait-for-pre-merge.outputs.pre_merge_run_id != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: docker-images-attestation-verifier
          run-id: ${{ needs.wait-for-pre-merge.outputs.pre_merge_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}

      - name: Download docker-images-kata-deploy artifact
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]' && contains(needs.pre-checks.outputs.changed_projects, 'trusted-workload') && needs.wait-for-pre-merge.outputs.pre_merge_run_id != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: docker-images-kata-deploy
          run-id: ${{ needs.wait-for-pre-merge.outputs.pre_merge_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}

      - name: Download docker-images-attestation-manager artifact
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]' && contains(needs.pre-checks.outputs.changed_projects, 'attestation-manager') && needs.wait-for-pre-merge.outputs.pre_merge_run_id != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: docker-images-attestation-manager
          run-id: ${{ needs.wait-for-pre-merge.outputs.pre_merge_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}

      - name: Add docker images from artifacts to installation package
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]' }}
        run: |
          set -euo pipefail

          SRC_REGISTRY="080137407410.dkr.ecr.us-west-2.amazonaws.com"
          DST_REGISTRY="registry-rs.edgeorchestration.intel.com"

          PKG_TGZ="baremetal/trusted-compute-installation-package.tgz"
          if [[ ! -f "$PKG_TGZ" ]]; then
            echo "Package not found: $PKG_TGZ"
            exit 1
          fi

          WORKDIR="$(mktemp -d)"
          trap 'rm -rf "$WORKDIR"' EXIT

          tar -xzf "$PKG_TGZ" -C "$WORKDIR"
          PKG_DIR="$WORKDIR/trusted-compute-installation-package"
          IMAGES_DIR="$PKG_DIR/images"

          shopt -s nullglob
          mapfile -t image_tars < <(find . -type f -name "${SRC_REGISTRY}*.tar")
          shopt -u nullglob

          if [[ ${#image_tars[@]} -eq 0 ]]; then
            echo "No downloaded ${SRC_REGISTRY} image tars were found."
          else
            for tar_file in "${image_tars[@]}"; do
              echo "Retagging images from artifact tar: $tar_file"
              load_output="$(sudo docker load -i "$tar_file")"
              mapfile -t loaded_images < <(printf '%s\n' "$load_output" | awk -F'Loaded image: ' 'NF > 1 {print $2}')

              if [[ ${#loaded_images[@]} -eq 0 ]]; then
                echo "No loadable image references found in: $tar_file"
                continue
              fi

              for src_image in "${loaded_images[@]}"; do
                if [[ "$src_image" != ${SRC_REGISTRY}/* ]]; then
                  echo "Skipping non-${SRC_REGISTRY} image: $src_image"
                  continue
                fi

                dst_image="${src_image/#${SRC_REGISTRY}/${DST_REGISTRY}}"
                dst_tar_name="$(echo "$dst_image" | sed 's#[/:]#-#g').tar"
                dst_tar_path="$IMAGES_DIR/$dst_tar_name"

                sudo docker tag "$src_image" "$dst_image"
                sudo docker save -o "$dst_tar_path" "$dst_image"
                sudo chown "$USER":"$USER" "$dst_tar_path"
                echo "Created RS-tagged tar: $dst_tar_path"
              done
            done
          fi

          tar -C "$WORKDIR" -czf "$PKG_TGZ" trusted-compute-installation-package
          ls -lh "$PKG_TGZ"

      - name: Initialize swtpm local CA files for package patching
        run: |
          set -euo pipefail

          sudo apt-get update -qq
          sudo apt-get install -y swtpm swtpm-tools

          TPM_STATE_DIR="$(mktemp -d)"
          cleanup() {
            sudo rm -rf "$TPM_STATE_DIR"
          }
          trap cleanup EXIT

          sudo chown root:root "$TPM_STATE_DIR"
          sudo chmod 700 "$TPM_STATE_DIR"

          sudo swtpm_setup \
            --tpm2 \
            --tpm-state "$TPM_STATE_DIR" \
            --create-ek-cert \
            --create-platform-cert \
            --lock-nvram \
            --overwrite

          sudo test -f /var/lib/swtpm-localca/swtpm-localca-rootca-cert.pem
          sudo test -f /var/lib/swtpm-localca/01.pem
          sudo test -f /var/lib/swtpm-localca/signkey.pem
          sudo test -f /var/lib/swtpm-localca/issuercert.pem
          sudo test -f /var/lib/swtpm-localca/certserial
          sudo test -f /var/lib/swtpm-localca/swtpm-localca-rootca-privkey.pem
          sudo find /var/lib/swtpm-localca -maxdepth 1 -type f -printf '%f\n' | sort

          sudo tar -C /var/lib -czf "$GITHUB_WORKSPACE/baremetal/swtpm-localca.tar.gz" swtpm-localca
          sudo chown "$USER":"$USER" baremetal/swtpm-localca.tar.gz

      - name: Patch HVS and kata-deploy in installation package
        run: |
          set -euxo pipefail

          PKG_TGZ="baremetal/trusted-compute-installation-package.tgz"
          SRC_ROOT_CA="/var/lib/swtpm-localca/swtpm-localca-rootca-cert.pem"
          SRC_01_PEM="/var/lib/swtpm-localca/01.pem"

          if [[ ! -f "$PKG_TGZ" ]]; then
            echo "Package not found: $PKG_TGZ"
            exit 1
          fi

          if ! sudo test -f "$SRC_ROOT_CA" || ! sudo test -f "$SRC_01_PEM"; then
            echo "Missing required swtpm CA files:"
            echo "  $SRC_ROOT_CA"
            echo "  $SRC_01_PEM"
            echo "Ensure the swtpm local CA initialization step completed successfully."
            exit 1
          fi

          WORKDIR="$(mktemp -d)"
          trap 'rm -rf "$WORKDIR"' EXIT

          # Read source CA files with root privileges and stage them for image copy.
          STAGED_ROOT_CA="$WORKDIR/swtpm-localca-rootca-cert.pem"
          STAGED_01_PEM_RAW="$WORKDIR/01.raw.pem"
          STAGED_01_PEM="$WORKDIR/01.pem"
          sudo cp "$SRC_ROOT_CA" "$STAGED_ROOT_CA"
          sudo cp "$SRC_01_PEM" "$STAGED_01_PEM_RAW"
          sudo chown "$USER":"$USER" "$STAGED_ROOT_CA" "$STAGED_01_PEM_RAW"

          # swtpm 01.pem may contain text output around the PEM. Normalize to clean PEM with openssl.
          if ! openssl x509 -in "$STAGED_01_PEM_RAW" -outform PEM -out "$STAGED_01_PEM" >/dev/null 2>&1; then
            echo "Failed to extract/normalize a valid PEM certificate from $SRC_01_PEM"
            exit 1
          fi

          tar -xzf "$PKG_TGZ" -C "$WORKDIR"

          PKG_DIR="$WORKDIR/trusted-compute-installation-package"
          HVS_TAR="$(find "$PKG_DIR/images" -maxdepth 1 -type f -name '*attestation-verifier-hvs-*.tar' | head -n1)"

          if [[ -z "$HVS_TAR" ]]; then
            echo "Unable to locate HVS image tar in package images/"
            exit 1
          fi

          echo "Patching image tar: $HVS_TAR"

          load_out="$(sudo docker load -i "$HVS_TAR")"
          image_ref="$(printf '%s\n' "$load_out" | awk -F'Loaded image: ' 'NF>1{print $2; exit}')"
          if [[ -z "$image_ref" ]]; then
            echo "Failed to parse loaded image reference"
            echo "$load_out"
            exit 1
          fi

          orig_entrypoint="$(sudo docker image inspect --format '{{json .Config.Entrypoint}}' "$image_ref")"
          orig_cmd="$(sudo docker image inspect --format '{{json .Config.Cmd}}' "$image_ref")"

          cid="$(sudo docker run -d --entrypoint /bin/sh "$image_ref" -c 'sleep 600')"
          sudo docker cp "$STAGED_ROOT_CA" "$cid":/tmp/.swtpm-localca-rootca-cert.pem
          sudo docker cp "$STAGED_01_PEM" "$cid":/tmp/.swtpm-01.pem
          sudo docker exec -u 0 "$cid" /bin/sh -c '
            set -e
            if [ ! -f /tmp/external-eca.pem ]; then
              echo "Missing target file in image: /tmp/external-eca.pem"
              exit 1
            fi
            printf "\n" >> /tmp/external-eca.pem
            cat /tmp/.swtpm-localca-rootca-cert.pem >> /tmp/external-eca.pem
            printf "\n" >> /tmp/external-eca.pem
            cat /tmp/.swtpm-01.pem >> /tmp/external-eca.pem
            rm -f /tmp/.swtpm-localca-rootca-cert.pem /tmp/.swtpm-01.pem
          '

          patched_ref="$image_ref"

          commit_args=()
          if [[ "$orig_entrypoint" != "null" ]]; then
            commit_args+=(--change "ENTRYPOINT $orig_entrypoint")
          fi
          if [[ "$orig_cmd" != "null" ]]; then
            commit_args+=(--change "CMD $orig_cmd")
          fi

          sudo docker commit "${commit_args[@]}" "$cid" "$patched_ref" >/dev/null
          sudo docker rm -f "$cid" >/dev/null

          sudo docker save -o "$HVS_TAR" "$patched_ref"
          sudo chown "$USER":"$USER" "$HVS_TAR"

          # Patch kata-deploy image configuration for nested VM execution.
          KATA_DEPLOY_TAR="$(find "$PKG_DIR/images" -maxdepth 1 -type f -name '*kata-deploy*.tar' | head -n1)"

          if [[ -z "$KATA_DEPLOY_TAR" ]]; then
            echo "Unable to locate kata-deploy image tar in package images/"
            exit 1
          fi

          echo "Patching image tar: $KATA_DEPLOY_TAR"

          kd_load_out="$(sudo docker load -i "$KATA_DEPLOY_TAR")"
          kd_image_ref="$(printf '%s\n' "$kd_load_out" | awk -F'Loaded image: ' 'NF>1{print $2; exit}')"
          if [[ -z "$kd_image_ref" ]]; then
            echo "Failed to parse loaded kata-deploy image reference"
            echo "$kd_load_out"
            exit 1
          fi

          kd_cid="$(sudo docker create "$kd_image_ref")"

          #In 3.32 config files live inside the compressed kata-static tarball.
          # Copy it out, patch the configs, repack, and copy it back.
          KD_TARBALLS_WORKDIR="$WORKDIR/kata-tarballs"
          KD_EXTRACT_DIR="$WORKDIR/kata-extract"

          sudo docker cp "$kd_cid:/opt/kata-artifacts/tarballs" "$KD_TARBALLS_WORKDIR"

          KD_TARBALL_HOST="$(ls "$KD_TARBALLS_WORKDIR"/kata-static-*.tar.zst | head -1)"
          KD_TARBALL_BASENAME="$(basename "$KD_TARBALL_HOST")"

          mkdir -p "$KD_EXTRACT_DIR"
          sudo tar --zstd -xf "$KD_TARBALL_HOST" -C "$KD_EXTRACT_DIR"

          for KD_CFG_REL in \
            "opt/kata/share/defaults/kata-containers/configuration-qemu.toml" \
            "opt/kata/share/defaults/kata-containers/configuration.toml"; do
            KD_CFG_HOST="$KD_EXTRACT_DIR/$KD_CFG_REL"
            sudo test -f "$KD_CFG_HOST" || continue

            # Avoid verbose guest boot logging, which can exceed the CRI sandbox deadline in nested VMs.
            sudo sed -i -E 's/^(\s*enable_debug\s*=\s*)true/\1false/' "$KD_CFG_HOST"
            sudo grep -Eq '^\s*enable_debug\s*=\s*false' "$KD_CFG_HOST"

            # Increase dial and container creation timeouts for nested VMs on small runners.
            sudo sed -i -E 's/^#?(\s*dial_timeout\s*=\s*)[0-9]+/\1900/' "$KD_CFG_HOST"
            sudo sed -i -E 's/^#?(\s*create_container_timeout\s*=\s*)[0-9]+/\1900/' "$KD_CFG_HOST"

            # Increase kata vCPU count from the default value.
            sudo sed -i -E 's/^#?(\s*default_vcpus\s*=\s*)[0-9]+/\14/' "$KD_CFG_HOST"
            sudo grep -E 'dial_timeout|create_container_timeout|default_vcpus' "$KD_CFG_HOST"
          done

          sudo tar --zstd -cf "$KD_TARBALL_HOST" -C "$KD_EXTRACT_DIR" .
          sudo docker cp "$KD_TARBALL_HOST" "$kd_cid:/opt/kata-artifacts/tarballs/$KD_TARBALL_BASENAME"
          sudo rm -rf "$KD_TARBALLS_WORKDIR" "$KD_EXTRACT_DIR"

          sudo docker commit "$kd_cid" "$kd_image_ref" >/dev/null
          sudo docker rm -f "$kd_cid" >/dev/null

          sudo docker save -o "$KATA_DEPLOY_TAR" "$kd_image_ref"
          sudo chown "$USER":"$USER" "$KATA_DEPLOY_TAR"

          # Patch containerd template in package for debug mode.
          CONTAINERD_CFG_TPL="$PKG_DIR/containerd/config-v3.toml.tmpl"
          if [[ ! -f "$CONTAINERD_CFG_TPL" ]]; then
            echo "Unable to locate containerd config template in package: $CONTAINERD_CFG_TPL"
            exit 1
          fi

          if grep -qE '^\[debug\]' "$CONTAINERD_CFG_TPL"; then
            sudo sed -i -E '/^\[debug\]/,$ s/^\s*level\s*=.*/  level = "debug"/' "$CONTAINERD_CFG_TPL"
          else
            printf '\n[debug]\n  level = "debug"\n' | sudo tee -a "$CONTAINERD_CFG_TPL" >/dev/null
          fi

          grep -nE '^\[debug\]|^\s*level\s*=\s*"debug"' "$CONTAINERD_CFG_TPL"

          tar -C "$WORKDIR" -czf "$PKG_TGZ" trusted-compute-installation-package

          echo "Patched package generated:"
          ls -lh "$PKG_TGZ"

      - name: Upload installation package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: trusted-compute-installation-package
          path: |
            baremetal/trusted-compute-installation-package.tgz
            baremetal/swtpm-localca.tar.gz
          if-no-files-found: error
          retention-days: 1

  run-golden-suite:
    if: ${{ always() && needs.prepare-installation-package.result == 'success' }}
    permissions:
      actions: read
      contents: read
    needs: [pre-checks, prepare-installation-package]
    name: Run Golden Suite Trusted Compute Tests for baremetal package (${{ matrix.deployment }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - deployment: k3s
            runner: ${{ (contains(needs.pre-checks.outputs.changed_projects, 'trusted-workload') || contains(needs.pre-checks.outputs.changed_projects, 'trusted-vm')) && 'ubuntu-24.04-8core-32GB' || 'ubuntu-latest' }}
            robot_exclude_tag: ${{ (!contains(needs.pre-checks.outputs.changed_projects, 'trusted-workload') && !contains(needs.pre-checks.outputs.changed_projects, 'trusted-vm')) && 'sample' || '' }}
            robot_test_file: tests/golden_suite_install_tests.robot
            vm_logs_artifact: vm-boot-logs-k3s
            robot_results_artifact: robot-results-k3s
          - deployment: docker
            runner: ubuntu-latest
            robot_exclude_tag: ''
            robot_test_file: tests/golden_suite_install_tests_docker.robot
            vm_logs_artifact: vm-boot-logs-docker
            robot_results_artifact: robot-results-docker
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      - name: Download installation package artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: trusted-compute-installation-package
          path: baremetal

      - name: Verify downloaded installation package
        run: |
          test -f baremetal/trusted-compute-installation-package.tgz
          ls -lh baremetal/trusted-compute-installation-package.tgz

      - name: Show system resources
        run: |
          echo "CPU cores: $(nproc)"
          echo "RAM size: $(free -m | awk '/^Mem:/ {print $2 " MB"}')"
          free -h

      - name: Setup VM prerequisites
        run: |
          echo "Installing VM and TPM prerequisites..."
          sudo apt-get update -qq
          sudo apt-get install -y \
            qemu-system-x86-64 \
            ovmf \
            libvirt-daemon-system \
            libvirt-clients \
            virt-manager \
            virtinst \
            swtpm \
            swtpm-tools \
            tpm2-tools \
            expect \
            wget
          
          echo "Prerequisites installation completed"

      - name: Restore swtpm local CA used to patch HVS
        run: |
          set -euo pipefail

          test -f baremetal/swtpm-localca.tar.gz
          sudo rm -rf /var/lib/swtpm-localca
          sudo tar -C /var/lib -xzf baremetal/swtpm-localca.tar.gz
          sudo chown -R swtpm:root /var/lib/swtpm-localca
          sudo chmod 0750 /var/lib/swtpm-localca

      - name: Start libvirt service
        run: |
          echo "Starting libvirt service..."
          sudo systemctl start libvirtd
          sudo systemctl status libvirtd
          echo "libvirt service started"

      - name: Create Ubuntu 24 VM with TPM
        run: |
          echo "Creating VM with Ubuntu 24, TPM, and Secure Boot..."
          sudo chmod +x ./.github/scripts/create-ubuntu24-vm-with-tpm.sh
          sudo ./.github/scripts/create-ubuntu24-vm-with-tpm.sh test-vm 12 16 100
          
          echo "VM creation completed"
          
          echo "\nVM Status:"
          sudo virsh list --all
          
          echo "\nVM Configuration:"
          sudo virsh dominfo test-vm

      - name: Start VM and verify OS release via console
        env:
          VM_USERNAME: user
          VM_PASSWORD: user
        run: |
          echo "Starting VM..."
          sudo virsh start test-vm

          echo "Waiting for VM console login..."
          expect << 'EOF'
            set timeout 10
            set logged_in 0
            set deadline [expr {[clock seconds] + 300}]
            spawn sudo virsh console test-vm

            send -- "\r"
            expect {
              -re {login: ?$} {
                send -- "$env(VM_USERNAME)\r"
                exp_continue
              }
              -re {Password: ?$} {
                send -- "$env(VM_PASSWORD)\r"
                exp_continue
              }
              -re {Login incorrect} {
                after 2000
                send -- "\r"
                exp_continue
              }
              -re {[#$] $} {
                set logged_in 1
              }
              timeout {
                if {[clock seconds] >= $deadline} {
                  puts "Timed out after 300 seconds waiting for successful console login"
                  exit 1
                }
                send -- "\r"
                exp_continue
              }
              eof { puts "Console closed unexpectedly"; exit 1 }
            }

            if {$logged_in == 0} {
              puts "Timed out after 300 seconds waiting for successful console login"
              exit 1
            }

            set timeout 300
            send -- "cloud-init status --wait; printf 'CLOUD_INIT_RC=%s\\n' \"\$?\"\r"

            expect {
              -re {CLOUD_INIT_RC=([0-9]+)} {
                if {$expect_out(1,string) != 0} {
                  puts "cloud-init failed with status $expect_out(1,string)"
                  exit 1
                }
              }
              timeout { puts "Timed out waiting for cloud-init to complete"; exit 1 }
              eof { puts "Console closed unexpectedly"; exit 1 }
            }

            expect {
              -re {[#$] $} {}
              timeout { puts "Timed out waiting for shell prompt after cloud-init"; exit 1 }
              eof { puts "Console closed unexpectedly"; exit 1 }
            }

            set timeout 60
            send -- "cat /etc/os-release\r"

            expect {
              -re "PRETTY_NAME=.*" {}
              timeout { puts "Timed out waiting for /etc/os-release output"; exit 1 }
              eof { puts "Console closed unexpectedly"; exit 1 }
            }

            expect {
              -re {[#$] $} {}
              timeout { puts "Timed out waiting for shell prompt after os-release command"; exit 1 }
              eof { puts "Console closed unexpectedly"; exit 1 }
            }

            send -- "sudo apt-get update -qq\r"

            expect {
              -re {[#$] $} {}
              timeout { puts "Timed out waiting for shell prompt after apt-get update"; exit 1 }
              eof { puts "Console closed unexpectedly"; exit 1 }
            }

            send -- "sudo apt-get install -y tpm2-tools\r"

            expect {
              -re {[#$] $} {}
              timeout { puts "Timed out waiting for shell prompt after tpm2-tools install"; exit 1 }
              eof { puts "Console closed unexpectedly"; exit 1 }
            }

            send -- "grep -E --color=never -m1 'vmx|svm' /proc/cpuinfo\r"

            expect {
              -re {(vmx|svm)} {}
              timeout { puts "Timed out waiting for nested virtualization CPU flags in /proc/cpuinfo"; exit 1 }
              eof { puts "Console closed unexpectedly"; exit 1 }
            }

            expect {
              -re {[#$] $} {}
              timeout { puts "Timed out waiting for shell prompt after nested virtualization CPU flag check"; exit 1 }
              eof { puts "Console closed unexpectedly"; exit 1 }
            }

            send -- "test -c /dev/kvm && ls -l /dev/kvm\r"

            expect {
              -re {/dev/kvm} {}
              timeout { puts "Timed out waiting for /dev/kvm to appear in the DUT"; exit 1 }
              eof { puts "Console closed unexpectedly"; exit 1 }
            }

            expect {
              -re {[#$] $} {}
              timeout { puts "Timed out waiting for shell prompt after /dev/kvm check"; exit 1 }
              eof { puts "Console closed unexpectedly"; exit 1 }
            }

            send -- "test -c /dev/vhost-vsock && ls -l /dev/vhost-vsock\r"

            expect {
              -re {/dev/vhost-vsock} {}
              timeout { puts "Timed out waiting for /dev/vhost-vsock to appear in the DUT"; exit 1 }
              eof { puts "Console closed unexpectedly"; exit 1 }
            }

            expect {
              -re {[#$] $} {}
              timeout { puts "Timed out waiting for shell prompt after /dev/vhost-vsock check"; exit 1 }
              eof { puts "Console closed unexpectedly"; exit 1 }
            }

            send -- "sudo tpm2_pcrread\r"

            expect {
              -re {[#$] $} {}
              timeout { puts "Timed out waiting for shell prompt after tpm2_pcrread"; exit 1 }
              eof { puts "Console closed unexpectedly"; exit 1 }
            }

            send -- "ls -l /sys/kernel/security/ima/policy\r"

            expect {
              -re {[#$] $} {}
              timeout { puts "Timed out waiting for shell prompt after ima policy ls"; exit 1 }
              eof { puts "Console closed unexpectedly"; exit 1 }
            }

            send -- "exit\r"
            send -- "\035"
            expect eof
          EOF

      - name: Install Robot Framework and SSHLibrary
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-paramiko python3-scp

          cat > /tmp/robot-requirements.txt << 'EOF'
          robotframework==7.0.1 \
            --hash=sha256:7f469492311f10e3be69d8ca2f2cae6b6490030d59683d23cd7909088c286d8 \
            --hash=sha256:58d01b84cd7eccea69f2dbe13cbcbff1299e551168d3b88c25617b0c9d6ddc75
          robotframework-sshlibrary==3.8.0 \
            --hash=sha256:aedf8a02bcb7344404cf8575d0ada25d6c7dc2fcb65de2113c4e07c63d2446c2
          EOF

          python3 -m pip install --no-deps --require-hashes -r /tmp/robot-requirements.txt

      - name: Run Robot Framework golden suite
        env:
          ROBOT_EXCLUDE_TAG: ${{ matrix.robot_exclude_tag }}
        run: |
          set -euo pipefail

          DUT_IP=""
          for _ in $(seq 1 20); do
            DUT_IP="$(sudo virsh net-dhcp-leases default | awk '/test-vm/ {print $5}' | cut -d/ -f1 | head -n1)"
            if [[ -n "$DUT_IP" ]]; then
              break
            fi
            sleep 5
          done

          if [[ -z "$DUT_IP" ]]; then
            echo "Unable to determine DUT IP from libvirt DHCP leases"
            sudo virsh net-dhcp-leases default || true
            exit 1
          fi

          robot_options=()
          if [[ -n "$ROBOT_EXCLUDE_TAG" ]]; then
            robot_options+=(--exclude "$ROBOT_EXCLUDE_TAG")
            echo "Skipping Robot tests tagged: $ROBOT_EXCLUDE_TAG"
          fi

          echo "Running Robot Framework golden suite (${{ matrix.deployment }}) against DUT at $DUT_IP"
          robot \
            "${robot_options[@]}" \
            --outputdir vm-logs/robot-results \
            --variable DUT_HOST:"$DUT_IP" \
            --variable DUT_USERNAME:user \
            --variable DUT_PASSWORD:user \
            --variable TC_PACKAGE:baremetal/trusted-compute-installation-package.tgz \
            --variable INSTALL_TIMEOUT:600 \
            ${{ matrix.robot_test_file }}

      - name: Collect VM boot logs
        if: always()
        run: |
          mkdir -p vm-logs

          echo "Collecting libvirt and VM diagnostics..."
          sudo virsh list --all > vm-logs/virsh-list-all.txt 2>&1 || true
          sudo virsh dominfo test-vm > vm-logs/dominfo.txt 2>&1 || true
          sudo virsh domstate test-vm > vm-logs/domstate.txt 2>&1 || true
          sudo virsh dumpxml test-vm > vm-logs/domain.xml 2>&1 || true

          echo "Collecting qemu and libvirt service logs..."
          sudo ls -la /var/log/libvirt/qemu > vm-logs/qemu-log-dir.txt 2>&1 || true
          sudo cp /var/log/libvirt/qemu/test-vm.log vm-logs/test-vm.log 2>/dev/null || true
          sudo cp -a /var/log/swtpm vm-logs/swtpm 2>/dev/null || true
          sudo journalctl -u libvirtd --no-pager --since "-30 min" > vm-logs/libvirtd-journal.txt 2>&1 || true
          sudo journalctl -u virtlogd --no-pager --since "-30 min" > vm-logs/virtlogd-journal.txt 2>&1 || true

          # Ensure artifact files are accessible to the non-root GitHub Actions runner user.
          sudo chown -R "$USER":"$USER" vm-logs || true
          chmod -R u+rwX,go+rX vm-logs || true

      - name: Upload VM boot logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ matrix.vm_logs_artifact }}
          path: vm-logs
          if-no-files-found: warn

