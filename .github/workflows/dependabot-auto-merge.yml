---
name: Dependabot auto-approve and auto-merge PR

on:
  # Trigger workflow on PRs to all branches
  pull_request:
    branches:
      - "*"
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: read

jobs:
  dependabot:
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Approve Dependabot PR
        if: contains(fromJSON('["version-update:semver-patch","version-update:semver-minor","version-update:semver-major"]'), steps.metadata.outputs.update-type)
        continue-on-error: true
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.SYS_EMF_GH_TOKEN }}

      - name: Enable auto-merge for Dependabot PR
        if: contains(fromJSON('["version-update:semver-patch","version-update:semver-minor","version-update:semver-major"]'), steps.metadata.outputs.update-type)
        continue-on-error: true
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.SYS_EMF_GH_TOKEN }}

      - name: Checkout PR branch
        if: failure()
        uses: actions/checkout@11bd71901efe0b5b596a9a00f1027a0e475b5362 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        if: steps.checkout_pr.outcome == 'success'
        run: |
          git config user.name "dependabot[bot]"
          git config user.email "dependabot[bot]@users.noreply.github.com"

      - name: Create empty commit to retrigger workflow
        if: steps.checkout_pr.outcome == 'success'
        run: |
          if [ "$(git log -1 --pretty=%s)" = "chore: retrigger workflow" ]; then
            echo "Last commit is already a retrigger commit; skipping to avoid loops."
            exit 0
          fi
          git commit --allow-empty -m "chore: retrigger workflow"
          git push origin ${{ github.event.pull_request.head.ref }}