{{- include "factory.headers" . }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "factory.name" . }}-base
  namespace: {{ .Release.Namespace }}
spec:
  accessModes:
    - {{ .Values.storage.hostPath.accessModes }}
  resources:
    requests:
      storage: {{ .Values.storage.hostPath.baseSize }}