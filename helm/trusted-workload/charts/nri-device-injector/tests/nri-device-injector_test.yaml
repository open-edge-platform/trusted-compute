---
suite: nri-device-injector
templates:
  - nri-device-injector.yaml

tests:
  - it: should create a DaemonSet for NRI device injector
    asserts:
      - isAPIVersion:
          of: apps/v1
      - isKind:
          of: DaemonSet
  - it: should have correct metadata and labels
    asserts:
      - equal:
          path: metadata.name
          value: nri-plugin-device-injector
      - equal:
          path: metadata.namespace
          value: kube-system
      - equal:
          path: metadata.labels
          value:
            app.kubernetes.io/name: nri-plugin-device-injector
      - equal:
          path: spec.selector.matchLabels
          value:
            app.kubernetes.io/name: nri-plugin-device-injector
      - equal:
          path: spec.template.metadata.labels
          value:
            app.kubernetes.io/name: nri-plugin-device-injector

  - it: should have correct container specification
    asserts:
      - equal:
          path: spec.template.spec.containers[0].name
          value: plugin
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/containerd/nri/plugins/device-injector:v0.10.0
      - equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: IfNotPresent
      - equal:
          path: spec.template.spec.containers[0].args
          value: 
            - -idx
            - "10"
      - equal:
          path: spec.template.spec.containers[0].resources.requests
          value:
            cpu: 2m
            memory: 5Mi
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - equal:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          value: 
            - ALL

  - it: should have correct volume and mount configuration
    asserts:
      - equal:
          path: spec.template.spec.volumes[0].name
          value: nri-socket
      - equal:
          path: spec.template.spec.volumes[0].hostPath.path
          value: /var/run/nri/nri.sock
      - equal:
          path: spec.template.spec.volumes[0].hostPath.type
          value: Socket
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].name
          value: nri-socket
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].mountPath
          value: /var/run/nri/nri.sock

  - it: should set system-node-critical priority
    asserts:
      - equal:
          path: spec.template.spec.priorityClassName
          value: system-node-critical
