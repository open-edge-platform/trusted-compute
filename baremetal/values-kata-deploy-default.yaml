---
image:
  reference: registry-rs.edgeorchestration.intel.com/edge-orch/trusted-compute/kata-deploy
  tag:
k8sDistribution: "k3s" # k8s, k3s, rke2, k0s, microk8s
# Chart >= 4.1 defaults to "job", which needs the k8s-job-dispatcher image (not in the offline bundle)
deploymentMode: daemonset
debug: false
snapshotter:
  setup: [] # ["nydus", "erofs"] or []
# Shim configuration
# By default (disableAll: false), all shims with enabled: ~ (null) are enabled.
# Set disableAll: true to disable all shims, then explicitly enable specific ones:
#   shims:
#     disableAll: true
#     qemu-runtime-rs:
#       enabled: true  # Only qemu-runtime-rs is enabled
shims:
  disableAll: true
  qemu-runtime-rs:
    enabled: true
    supportedArches:
      - amd64
    containerd:
      snapshotter: ""
# Default shim per architecture
defaultShim:
  amd64: qemu-runtime-rs
runtimeClasses:
  enabled: true
  # Also emit a "kata-qemu" RuntimeClass (handler kata-qemu-runtime-rs) so pre-4.x manifests keep working
  createDefault: true
  defaultName: "kata-qemu"
node-feature-discovery:
  enabled: false
imagePullPolicy: IfNotPresent
