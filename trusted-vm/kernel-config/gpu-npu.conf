# Intel integrated GPU (i915/Xe) and NPU (ivpu) in-guest driver support.
#
# These devices are passed through to the guest VM whole via VFIO (see
# docs/trusted_compute_gpu_enablement.md and trusted_compute_npu_enablement.md),
# so the guest kernel itself must contain the native driver - host-side VFIO
# binding only hands the PCI device to the VM, it does not drive it.
#
# Built in (=y) rather than modules (=m): kata boots a monolithic kernel
# image with no initrd, so there is no module-loading step before the
# passed-through device needs to probe.
#
# Matching firmware blobs are installed separately into the guest rootfs
# at /lib/firmware (see install_gpu_firmware/install_npu_firmware in
# tvm_image_inside_container.sh) - request_firmware() is called from the
# guest kernel after the VFIO device is hot-plugged post-boot, so it reads
# from the already-mounted guest root filesystem.

# GPU: Intel integrated graphics (Gen 8-11 via i915, Gen12+/Xe-arch via xe)
CONFIG_DRM=y
CONFIG_DRM_I915=y
CONFIG_DRM_I915_USERPTR=y
CONFIG_DRM_XE=y

# NPU: Intel Neural Processing Unit (Meteor Lake and newer)
CONFIG_DRM_ACCEL=y
CONFIG_DRM_ACCEL_IVPU=y
