---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: curl-httpbin-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: curl-httpbin
  template:
    metadata:
      labels:
        app: curl-httpbin
    spec:
      {{- if .Values.runtimeClassName }}
      runtimeClassName: {{ .Values.runtimeClassName | quote }}
      {{- end }}
      containers:
      - name: curl-httpbin
        image: curlimages/curl
        imagePullPolicy: Always
        command: ["sh", "-c", "while true; do curl -sS http://httpbin.org/headers; sleep 5; done"]
      securityContext:
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
      resources:
        requests:
          cpu: "100m"
          memory: "128Mi"
        limits:
          cpu: "200m"
          memory: "256Mi"
